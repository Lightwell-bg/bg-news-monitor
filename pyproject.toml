[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bg-news-monitor"
version = "0.1.0"
description = "Moderated Bulgarian news monitor for a Russian-speaking audience."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram>=3.0,<4.0",
  "aiosqlite>=0.20,<1.0",
  "apscheduler>=3.10,<4.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.0,<3.0",
  "pyyaml>=6.0,<7.0",
  "selectolax>=0.3,<1.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/news_monitor"]
